name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install numpy
      - run: python tests/run_all.py
      - run: python -m zerowhite doctor --quick
      - run: python -m zerowhite chat config --reference
      - run: python -c "import zerowhite.chat.cli, zerowhite.voice.cli"

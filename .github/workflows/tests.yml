name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-latest` now points at Ubuntu 26.04, which has no Python 3.9 build for actions/setup-python
        # ("The version '3.9' with architecture 'x64' was not found for Ubuntu 26.04"), so the Linux leg is pinned to an
        # image that has both 3.9 and 3.12. Move it forward when 3.9 is dropped.
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install numpy
      - run: python -u tests/run_all.py
        env:
          PYTHONFAULTHANDLER: "1"          # a native crash (exit 139 / segfault) prints the Python stack of the test that caused it
          VECLIB_MAXIMUM_THREADS: "1"      # macOS only: Apple's Accelerate BLAS (used by NumPy there) runs single-threaded, which is the safe setting for a suite that also uses threads and fork
      - run: python -m zerowhite doctor --quick
      - run: python -m zerowhite chat config --reference
      - run: python -c "import zerowhite.chat.cli, zerowhite.voice.cli"

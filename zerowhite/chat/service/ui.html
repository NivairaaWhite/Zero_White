<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="zw-token" content="__ZW_TOKEN__">
<meta name="zw-require-token" content="__ZW_REQUIRE_TOKEN__">
<title>Zero White</title>
<style>
:root {
  --paper: #ffffff;
  --wash: #f2f4f8;
  --ink: #181e2e;
  --soft: #556078;
  --faint: #7d869a;
  --rule: #d9dde8;
  --accent: #2a3fd0;
  --on-accent: #ffffff;
  --good: #1b7448;
  --bad: #a93428;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #14171f; --wash: #1b1f2a; --ink: #e8eaf1; --soft: #a5adc0; --faint: #7f879b;
    --rule: #2c3243; --accent: #93a1ff; --on-accent: #10131c; --good: #55c28b; --bad: #ee8176;
  }
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); background: var(--paper); font: 16px/1.5 var(--sans); }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; min-height: 100vh; }
.page { width: 100%; max-width: 42rem; margin: 0 auto; padding: 0 1.25rem; display: flex; flex-direction: column; min-height: 100vh; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding: 1.4rem 0 0.6rem; }
.top h1 { margin: 0; font: 600 1.15rem/1.2 var(--sans); letter-spacing: 0.01em; }
.tools { display: flex; align-items: center; gap: 1rem; font-size: 0.88rem; color: var(--soft); }
.link { background: none; border: 0; padding: 0.2rem 0; color: var(--soft); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); }
.link:hover { color: var(--ink); text-decoration-color: currentColor; }
.tools label { display: inline-flex; gap: 0.4rem; align-items: center; cursor: pointer; }

.notice { margin: 0.6rem 0; padding: 0.9rem 1rem; background: var(--wash); border-radius: 0.5rem; color: var(--ink); font-size: 0.94rem; }
.notice[hidden] { display: none; }
.notice p { margin: 0 0 0.5rem; }
.notice p:last-child { margin: 0; }
.notice code { font: 0.86em ui-monospace, "Cascadia Code", Consolas, monospace; overflow-wrap: anywhere; }

#log { flex: 1; padding: 1rem 0 2rem; }
.intro { color: var(--soft); max-width: 34rem; margin: 3.5rem 0 0; font: 1.12rem/1.6 var(--serif); }
.intro strong { color: var(--ink); font-weight: 600; }
.turn { margin: 0 0 1.7rem; }
.you { padding-left: 0.85rem; border-left: 2px solid var(--accent); }
.you p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.bot p { margin: 0; font: 1.08rem/1.68 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; max-width: 40rem; }
.bot.pending p::after { content: ""; display: inline-block; width: 0.5ch; height: 1.05em; margin-left: 2px; vertical-align: text-bottom; background: var(--accent); animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.bot.empty p { color: var(--faint); font-style: italic; }
.acts { display: flex; flex-wrap: wrap; gap: 0.2rem 1.1rem; margin-top: 0.45rem; font-size: 0.85rem; opacity: 0; transition: opacity 0.12s; }
.turn:hover .acts, .turn:focus-within .acts, .turn.latest .acts { opacity: 1; }
@media (hover: none) { .acts { opacity: 1; } }
.acts button[aria-pressed="true"] { color: var(--ink); text-decoration-color: currentColor; font-weight: 600; }
.acts .saved { color: var(--good); }
.fix { margin-top: 0.7rem; max-width: 40rem; }
.fix textarea { width: 100%; min-height: 4.5rem; padding: 0.6rem 0.7rem; border: 1px solid var(--rule); border-radius: 0.4rem; background: var(--paper); resize: vertical; font: 1.02rem/1.55 var(--serif); }
.fix .row { display: flex; gap: 1rem; margin-top: 0.4rem; align-items: center; }
.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 0.4rem; padding: 0.45rem 0.95rem; font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.quiet { background: var(--wash); color: var(--ink); font-weight: 500; }
.err { color: var(--bad); font-size: 0.92rem; margin-top: 0.3rem; }

#composer { position: sticky; bottom: 0; background: var(--paper); padding: 0.6rem 0 1.1rem; display: flex; gap: 0.6rem; align-items: flex-end; }
#composer .field { flex: 1; border-bottom: 2px solid var(--rule); transition: border-color 0.12s; }
#composer .field:focus-within { border-bottom-color: var(--accent); }
#input { width: 100%; border: 0; outline: 0; resize: none; background: transparent; padding: 0.55rem 0.1rem; max-height: 10rem; font-size: 1rem; line-height: 1.5; }
#input::placeholder { color: var(--faint); }
.round { width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 1px solid var(--rule); background: transparent; display: grid; place-items: center; color: var(--soft); }
.round:hover { color: var(--ink); border-color: var(--soft); }
.round[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.round[hidden] { display: none; }

.ledger { background: var(--wash); padding: 1.4rem 1.3rem 2rem; font-size: 0.9rem; color: var(--soft); position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.ledger summary { display: none; }
.ledger h2 { margin: 1.5rem 0 0.35rem; font: 600 0.95rem/1.3 var(--sans); color: var(--ink); }
.ledger h2:first-of-type { margin-top: 0; }
.ledger p { margin: 0 0 0.4rem; }
.ledger .num { color: var(--ink); font-variant-numeric: tabular-nums; }
.ledger .actions { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; margin-top: 0.5rem; }
.bar { height: 4px; background: var(--rule); border-radius: 2px; margin: 0.5rem 0; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.4s; }
.change { color: var(--ink); }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .ledger { position: static; height: auto; order: -1; padding: 0.2rem 1.25rem; }
  .ledger summary { display: block; cursor: pointer; padding: 0.7rem 0; color: var(--ink); font-weight: 600; }
  .ledger-inner { padding-bottom: 1rem; }
  .page { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <main class="page">
    <header class="top">
      <h1 id="name">Zero White</h1>
      <div class="tools">
        <label id="speakWrap" hidden><input type="checkbox" id="speak"> Speak replies</label>
        <button class="link" id="newChat" type="button">New chat</button>
      </div>
    </header>
    <div id="notice" class="notice" hidden role="status"></div>
    <section id="log" aria-live="polite" aria-label="Conversation"></section>
    <form id="composer" autocomplete="off">
      <div class="field"><textarea id="input" rows="1" placeholder="Write a message" aria-label="Message"></textarea></div>
      <button type="button" class="round" id="mic" aria-label="Speak your message" aria-pressed="false" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button type="submit" class="btn" id="send">Send</button>
    </form>
  </main>
  <aside class="ledger" aria-label="Model and learning">
    <details id="ledgerBox" open>
      <summary>Model and learning</summary>
      <div class="ledger-inner" id="ledger"></div>
    </details>
  </aside>
</div>

<script>
"use strict";
const TOKEN = document.querySelector('meta[name="zw-token"]').content;
const NEED_TOKEN = document.querySelector('meta[name="zw-require-token"]').content === "1";
const $ = (s) => document.querySelector(s);
const log = $("#log"), input = $("#input"), sendBtn = $("#send"), notice = $("#notice");
let token = TOKEN || localStorage.getItem("zw-token") || "";
let session = localStorage.getItem("zw-session") || "";
let status = null, busy = false, abortCtl = null, voiceInfo = null;

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
async function api(path, opts = {}) {
  const headers = Object.assign({ "X-ZW-Token": token }, opts.headers || {});
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401 && NEED_TOKEN) { const t = prompt("This server needs its access token (the file state/token in your workspace)."); if (t) { token = t.trim(); localStorage.setItem("zw-token", token); return api(path, opts); } }
  return r;
}
async function jpost(path, body) {
  const r = await api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("Request failed (" + r.status + ")"));
  return data;
}
const ago = (t) => { if (!t) return ""; const s = Math.max(0, Date.now() / 1000 - t); return s < 90 ? "just now" : s < 5400 ? Math.round(s / 60) + " minutes ago" : s < 129600 ? Math.round(s / 3600) + " hours ago" : Math.round(s / 86400) + " days ago"; };
const human = (n) => n >= 1e9 ? (n / 1e9).toFixed(1) + " billion" : n >= 1e6 ? (n / 1e6).toFixed(1) + " million" : n >= 1e3 ? (n / 1e3).toFixed(1) + " thousand" : String(n);
const eta = (s) => s < 90 ? Math.round(s) + " seconds" : s < 5400 ? Math.round(s / 60) + " minutes" : (s / 3600).toFixed(1) + " hours";

/* ---------- conversation ---------- */
function intro() {
  log.replaceChildren(el("p", { class: "intro" },
    status && status.greeting ? status.greeting + " " : "Ask anything. ",
    el("strong", { text: "When an answer is wrong, choose Fix it and type the answer you wanted." }),
    " The assistant learns from it."));
}
function addUser(text) { const t = el("div", { class: "turn you" }, el("p", { text })); log.append(t); t.scrollIntoView({ block: "end" }); return t; }
function addBot(text, id) {
  const p = el("p", { text: text || "" });
  const t = el("div", { class: "turn bot" + (text ? "" : " pending") }, p);
  if (id) { t.dataset.id = id; finishBot(t, text); }
  log.append(t); return t;
}
function markLatest() { log.querySelectorAll(".turn.latest").forEach((n) => n.classList.remove("latest")); const bots = log.querySelectorAll(".turn.bot[data-id]"); if (bots.length) bots[bots.length - 1].classList.add("latest"); }
function finishBot(t, text) {
  t.classList.remove("pending");
  if (!text) { t.classList.add("empty"); t.querySelector("p").textContent = "(no reply: the model produced nothing for this message)"; }
  t.querySelector(".acts")?.remove();
  const id = t.dataset.id;
  const acts = el("div", { class: "acts" });
  const good = el("button", { class: "link", type: "button", "aria-pressed": "false", text: "Good", onclick: () => rate(t, id, 1, good, bad) });
  const bad = el("button", { class: "link", type: "button", "aria-pressed": "false", text: "Not good", onclick: () => rate(t, id, -1, good, bad) });
  const fix = el("button", { class: "link", type: "button", text: "Fix it", onclick: () => openFix(t, id) });
  const again = el("button", { class: "link", type: "button", text: "Try again", onclick: () => regenerate() });
  acts.append(good, bad, fix, again);
  t.append(acts); markLatest();
}
async function rate(t, id, rating, good, bad) {
  try {
    await jpost("/api/feedback", { reply_id: id, rating });
    good.setAttribute("aria-pressed", String(rating > 0)); bad.setAttribute("aria-pressed", String(rating < 0));
    note(t, rating > 0 ? "Saved. It will reinforce this answer." : "Saved. Use Fix it to say what you wanted instead; a rating alone does not change the model.");
    setTimeout(refresh, 1500);
  } catch (e) { note(t, e.message, true); }
}
function note(t, msg, isErr) { t.querySelector(".msg")?.remove(); t.append(el("div", { class: isErr ? "err msg" : "acts saved msg", style: "opacity:1", text: msg })); }
function openFix(t, id) {
  if (t.querySelector(".fix")) return;
  const ta = el("textarea", { "aria-label": "The answer you wanted", placeholder: "Type the answer you wanted" });
  const go = el("button", { class: "btn", type: "button", text: "Teach this answer" });
  const cancel = el("button", { class: "link", type: "button", text: "Cancel", onclick: () => box.remove() });
  const box = el("div", { class: "fix" }, ta, el("div", { class: "row" }, go, cancel));
  go.onclick = async () => {
    const c = ta.value.trim(); if (!c) { ta.focus(); return; }
    go.disabled = true;
    try { await jpost("/api/feedback", { reply_id: id, rating: -1, correction: c }); box.remove(); note(t, "Saved. The assistant will learn this correction within a moment."); setTimeout(refresh, 2500); }
    catch (e) { go.disabled = false; note(t, e.message, true); }
  };
  t.append(box); ta.focus();
}

async function stream(path, body, botEl) {
  abortCtl = new AbortController(); setBusy(true);
  let text = "", doneEv = null;
  try {
    const r = await api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ stream: true, session }, body)), signal: abortCtl.signal });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || ("Request failed (" + r.status + ")")); }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.delta) { text += ev.delta; botEl.querySelector("p").textContent = text; botEl.scrollIntoView({ block: "end" }); }
        if (ev.done) doneEv = ev;
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") { botEl.classList.remove("pending"); botEl.append(el("div", { class: "err", text: e.message })); }
  } finally { setBusy(false); abortCtl = null; botEl.classList.remove("pending"); }
  if (doneEv) { botEl.dataset.id = doneEv.reply_id; session = doneEv.session; localStorage.setItem("zw-session", session); finishBot(botEl, doneEv.text); speakIfWanted(doneEv.text); setTimeout(refresh, 800); }
  return doneEv;
}
function setBusy(b) { busy = b; sendBtn.textContent = b ? "Stop" : "Send"; sendBtn.classList.toggle("quiet", b); }
async function send(text) {
  text = (text ?? input.value).trim(); if (!text || busy) return;
  if (status && !status.model.ready) { refresh(); return; }
  if (!session) await newSession();
  if (log.querySelector(".intro")) log.replaceChildren();
  input.value = ""; grow(); addUser(text);
  await stream("/api/chat", { message: text }, addBot("", null));
}
async function regenerate() {
  if (busy) return;
  const last = [...log.querySelectorAll(".turn.bot")].pop(); if (!last) return;
  last.querySelector("p").textContent = ""; last.className = "turn bot pending"; last.querySelector(".acts")?.remove(); last.querySelector(".msg")?.remove(); last.querySelector(".fix")?.remove();
  await stream("/api/regenerate", {}, last);
}
async function newSession() { const d = await jpost("/api/session", {}); session = d.session; localStorage.setItem("zw-session", session); return d; }
async function restore() {
  if (session) {
    try { const r = await api("/api/session?id=" + encodeURIComponent(session)); const d = await r.json();
      if (r.ok && d.turns && d.turns.length) { log.replaceChildren(); for (const t of d.turns) t.role === "user" ? addUser(t.content) : addBot(t.content, t.id || "x"); markLatest(); return; } } catch (e) { /* fall through */ }
  }
  intro();
}

/* ---------- ledger ---------- */
function renderLedger(s) {
  const L = $("#ledger"); L.replaceChildren();
  const sec = (title, ...kids) => { L.append(el("h2", { text: title }), ...kids); };
  const m = s.model;
  if (m.ready) {
    sec("Model", el("p", {}, el("span", { class: "num", text: human(m.params) }), " parameters, reads up to ", el("span", { class: "num", text: String(m.ctx) }), " tokens at once."),
      el("p", { text: (m.trained ? "Trained " + ago(m.trained) + ". " : "") + (m.val_nll != null ? "Perplexity on held-out data: " + Math.exp(Math.min(50, m.val_nll)).toFixed(0) + " (lower is better)." : "") }));
  } else sec("Model", el("p", { text: "Nothing is trained yet." }));
  const tr = s.training;
  if (tr && tr.state === "training") {
    const pct = Math.round(100 * tr.step / Math.max(1, tr.planned));
    sec("Training now", el("p", {}, "Step ", el("span", { class: "num", text: tr.step + " of " + tr.planned }), ", loss ", el("span", { class: "num", text: tr.loss.toFixed(2) }), "."),
      el("div", { class: "bar", role: "progressbar", "aria-valuenow": String(pct), "aria-valuemin": "0", "aria-valuemax": "100" }, el("i", { style: "width:" + pct + "%" })),
      el("p", { text: "About " + eta(tr.eta_s) + " left. Chat keeps working while it trains; the new model replaces this one only if it scores better." }));
  }
  const d = s.data;
  sec("Data folder", el("p", { class: "num", text: s.data_folder, style: "overflow-wrap:anywhere" }),
    el("p", { text: d.records ? human(d.records) + " examples from " + d.files + " file" + (d.files === 1 ? "" : "s") + ". New files are picked up automatically." : "Empty. Drop dataset files here (any sub-folder)." }),
    el("div", { class: "actions" }, el("button", { class: "link", type: "button", text: "Train on it now", disabled: !!(tr && tr.state === "training"), onclick: trainNow })));
  const o = s.online;
  const kids = [];
  if (!o.enabled) kids.push(el("p", { text: "Online learning is switched off." }));
  else {
    kids.push(el("p", {}, "It has answered ", el("span", { class: "num", text: String(o.replies || 0) }), " messages and received ", el("span", { class: "num", text: String(o.feedback || 0) }), " pieces of feedback. ",
      el("span", { class: "num", text: String(o.updates || 0) }), " learning update" + ((o.updates || 0) === 1 ? "" : "s") + " applied."));
    const r = o.last_result;
    if (r && r.updated) {
      const fit = r.fit_before && r.fit_after ? Math.round(100 * (1 - r.fit_after / r.fit_before)) : null;
      const gen = r.probe_before ? ((r.probe_after / r.probe_before - 1) * 100) : null;
      kids.push(el("p", { class: "change" }, "Last update " + ago(o.last_update) + ": " + (fit != null ? "your examples became " + fit + "% easier for the model to predict" : "applied") + (gen != null ? "; general quality changed by " + (gen >= 0 ? "+" : "") + gen.toFixed(1) + "% (updates that cost more than the limit are rejected)." : ".")));
    }
    kids.push(el("div", { class: "actions" }, el("button", { class: "link", type: "button", text: "Learn from feedback now", onclick: learnNow }), el("button", { class: "link", type: "button", text: "Undo last update", onclick: undo })));
  }
  sec("Learning from you", ...kids);
  if (voiceInfo && voiceInfo.available !== false) sec("Voice", el("p", { text: "Listening: " + (voiceInfo.stt || "not available") + ". Speaking: " + (voiceInfo.tts || "not available") + "." }));
  const nm = s.name || "Zero White"; $("#name").textContent = nm; document.title = nm;
}
async function trainNow() { try { const d = await jpost("/api/train", {}); flash(d.message || "Training requested."); setTimeout(refresh, 1200); } catch (e) { flash(e.message, true); } }
async function learnNow() { try { const d = await jpost("/api/learn", {}); flash(d.updated ? "Learned from your feedback." : (d.reason || "Nothing to learn yet.")); refresh(); } catch (e) { flash(e.message, true); } }
async function undo() { if (!confirm("Go back to the model version before the last update?")) return; try { const d = await jpost("/api/rollback", {}); flash("Now using " + d.version + "."); refresh(); } catch (e) { flash(e.message, true); } }
function flash(msg, isErr) { notice.hidden = false; notice.replaceChildren(el("p", { class: isErr ? "err" : "", text: msg })); setTimeout(() => { if (status) renderNotice(status); }, 5000); }
function renderNotice(s) {
  if (s.model.ready) { notice.hidden = true; return; }
  notice.hidden = false; const tr = s.training;
  notice.replaceChildren(el("p", { text: tr && tr.state === "training" ? "The first model is being trained (step " + tr.step + " of " + tr.planned + "). You can chat as soon as it finishes." : "There is no trained model yet." }),
    el("p", {}, "Put dataset files in ", el("code", { text: s.data_folder }), ". Training starts by itself once the files have finished copying, or press “Train on it now”."));
}
async function refresh() {
  try { const r = await api("/api/status"); status = await r.json(); renderLedger(status); renderNotice(status); if (log.querySelector(".intro")) intro(); } catch (e) { /* server restarting */ }
}

/* ---------- voice ---------- */
let rec = null, audioEl = null;
function wavFrom(float32, inRate, outRate = 16000) {
  const ratio = inRate / outRate, n = Math.floor(float32.length / ratio), out = new Int16Array(n);
  for (let i = 0; i < n; i++) { const a = Math.floor(i * ratio), b = Math.min(float32.length, Math.floor((i + 1) * ratio)); let s = 0; for (let j = a; j < b; j++) s += float32[j]; const v = Math.max(-1, Math.min(1, s / Math.max(1, b - a))); out[i] = v < 0 ? v * 0x8000 : v * 0x7fff; }
  const buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf), w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); dv.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, outRate, true); dv.setUint32(28, outRate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, "data"); dv.setUint32(40, n * 2, true);

async function toggleMic() {

  const mic = $("#mic"); mic.setAttribute("aria-pressed", "true"); mic.setAttribute("aria-label", "Stop listening");
  proc.onaudioprocess = (ev) => {
    const d = ev.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d));
    let e = 0; for (let i = 0; i < d.length; i++) e += d[i] * d[i]; e = Math.sqrt(e / d.length);

    const total = chunks.reduce((n, c) => n + c.length, 0), all = new Float32Array(total); let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; } const sr = ctx.sampleRate; ctx.close();

}
